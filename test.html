<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O C U L I S — Premium Eyewear</title>
  
  <!-- Clean, Modern Font Stack (Gemini-esque Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Animation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --text-light: #f5f5f7;
      --accent: #d4af37; /* Subtle champagne gold */
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal Premium Navbar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
    }

    .logo {
      font-weight: 600;
      letter-spacing: 4px;
      font-size: 1.2rem;
      text-transform: uppercase;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 40px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    /* Full-screen Sections */
    section {
      width: 100%;
      height: 100vh;
      display: flex;
      position: relative;
      align-items: center;
      justify-content: center;
      padding: 0 10%;
    }

    /* Section 1: Hero */
    .hero-container {
      text-align: center;
      position: relative;
    }

    .hero-title {
      font-size: 7vw;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      text-transform: uppercase;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 20px;
      opacity: 0.6;
    }

    /* Floating Spectacle Visual Target Container */
    .spectacle-viewer {
      position: absolute;
      width: 500px;
      height: 300px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Mock element placeholder for 3D Asset canvas */
    .mock-frame {
      width: 80%;
      height: 100px;
      border: 4px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      position: relative;
      transition: transform 0.1s ease-out;
    }
    .mock-frame::before, .mock-frame::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 80px;
      border: 4px solid var(--text-light);
      border-radius: 50%;
      top: 5px;
    }
    .mock-frame::before { left: 40px; }
    .mock-frame::after { right: 40px; }

    /* Section 2: Interactive Lens Lab */
    .lab-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      gap: 50px;
      align-items: center;
    }

    .lab-text h2 {
      font-size: 3.5rem;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .split-slider-container {
      position: relative;
      width: 100%;
      height: 450px;
      background: #1c1c1e;
      border-radius: 12px;
      overflow: hidden;
      cursor: ew-resize;
    }

    .layer-before, .layer-after {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .layer-before {
      background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=1000');
      filter: blur(4px) saturate(0.5); /* Simulates bad glare/reflection */
    }

    .layer-after {
      background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=1000');
      width: 50%; /* Initial split state */
      border-right: 2px solid var(--text-light);
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Oculis</div>
    <div class="nav-links">
      <a href="#collection">Collection</a>
      <a href="#lab">Lens Lab</a>
      <a href="#bespoke">Bespoke Studio</a>
    </div>
  </nav>

  <!-- Section 1: Hero Context -->
  <section class="hero-section">
    <div class="hero-container">
      <h1 class="hero-title">Precision<br>Vision</h1>
      <p class="hero-subtitle">Handcrafted architecture for the eyes.</p>
    </div>
    
    <div class="spectacle-viewer">
      <!-- Your 3D Canvas element or SVG goes here -->
      <div class="mock-frame" id="heroFrame"></div>
    </div>
  </section>

  <!-- Section 2: Lens Lab -->
  <section id="lab">
    <div class="lab-content">
      <div class="lab-text">
        <h2>Advanced Coating Demonstration</h2>
        <p style="opacity: 0.7; line-height: 1.6;">Drag the divider to see how our proprietary polarized anti-reflective matrix completely eliminates high-frequency distortion and surface glare in real-time.</p>
      </div>
      
      <div class="split-slider-container" id="sliderContainer">
        <div class="layer-before"></div>
        <div class="layer-after" id="revealLayer"></div>
      </div>
    </div>
  </section>

  <script>
    // Initialize GSAP ScrollTrigger Features
    gsap.registerPlugin(ScrollTrigger);

    // 1. Cinematic Entry Animation
    gsap.from(".hero-title", {
      y: 100,
      opacity: 0,
      duration: 1.4,
      ease: "power4.out"
    });

    gsap.from("#heroFrame", {
      scale: 0.4,
      rotateX: -45,
      opacity: 0,
      duration: 1.8,
      ease: "power3.out",
      delay: 0.2
    });

    // 2. Interactive Frame Tracking (Subtle premium perspective shifts on mouse movement)
    document.addEventListener("mousemove", (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      gsap.to("#heroFrame", {
        rotateY: xAxis,
        rotateX: -yAxis,
        duration: 0.5,
        ease: "power2.out"
      });
    });

    // 3. Scroll Animation: Frame transitions elegantly into the next section container
    gsap.to("#heroFrame", {
      scrollTrigger: {
        trigger: ".hero-section",
        start: "top top",
        end: "bottom top",
        scrub: true
      },
      y: 400,
      scale: 0.75,
      opacity: 0.3
    });

    // 4. Lens Lab Drag Reveal Feature Logic
    const container = document.getElementById('sliderContainer');
    const revealLayer = document.getElementById('revealLayer');

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const xPosition = e.clientX - rect.left;
      const percentage = (xPosition / rect.width) * 100;
      
      gsap.to(revealLayer, {
        width: `${percentage}%`,
        duration: 0.2,
        ease: "power1.out"
      });
    });
  </script>
</body>
</html>
