<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Gallery - Smooth Scroll Sync</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* --- RESET & BASE STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --transition-cubic: cubic-bezier(0.16, 1, 0.3, 1);
      --bg-color: #0a0a0a;
      --text-color: #ffffff;
      --text-muted: #86868b;
      --accent-color: #c5a880; /* Subtle gold */
    }

    /* Required CSS helper rules for Lenis Smooth Scroll */
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }
    .lenis.lenis-stopped {
      overflow: hidden;
    }
    .lenis.lenis-scrolling iframe {
      pointer-events: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Spacer to allow scrolling on load */
    .scroll-spacer {
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .scroll-spacer h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    .scroll-spacer p {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* --- LUXURY GALLERY SECTION --- */
    .luxury-gallery {
      max-width: 100%;
      margin: auto;
      height: 520px;
    }

    .section-header {
      margin-bottom: 80px;
      text-align: center;
    }

    /* Typography Reveal Base States */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -1px;
      line-height: 1.2;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1.6s var(--transition-cubic), transform 1.6s var(--transition-cubic);
    }

    .section-subtitle {
      font-size: 0.8rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 15px;
      display: block;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.6s var(--transition-cubic) 0.1s, transform 1.6s var(--transition-cubic) 0.1s;
    }

    /* --- THE GRID SYSTEM --- */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5rem;
    }

    .grid-card {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Smooth Image Wrapper */
    .image-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      background-color: #121212;
      border: 1px solid rgba(255, 255, 255, 0.03);
      
      /* Entrance animation base state */
      opacity: 0;
      transform: translateY(80px);
      transition: opacity 1.8s var(--transition-cubic), transform 1.8s var(--transition-cubic);
    }

    /* Parallax Image Target */
    .parallax-img {
      position: absolute;
      top: -15%; /* Extra padding on top & bottom so it doesn't crop out during scroll */
      left: 0;
      width: 100%;
      height: 170%; 
      object-fit: cover;
      filter: grayscale(20%) brightness(90%);
      will-change: transform; /* Bypasses main-thread lag by handing off to GPU */
      
      /* NO transitions here! Putting transitions on the transforms 
         updated by scroll makes it feel slow and rubbery.
      */
      transform: translateY(calc(var(--scroll-y, 0) * 0.18px));
    }

    /* Label Reveal Base State */
    .card-label {
      margin-top: 1.5rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.4s var(--transition-cubic), transform 1.4s var(--transition-cubic);
    }

    /* --- REVEAL TRIGGER STATES --- */
    .section-header.is-visible .section-title,
    .section-header.is-visible .section-subtitle {
      opacity: 1;
      transform: translateY(0);
    }

    .grid-card.is-visible .image-wrapper,
    .grid-card.is-visible .card-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* Premium Staggered Delays (Left to Right) */
    .grid-card.is-visible:nth-child(1) .image-wrapper { transition-delay: 0.1s; }
    .grid-card.is-visible:nth-child(1) .card-label     { transition-delay: 0.2s; }

    .grid-card.is-visible:nth-child(2) .image-wrapper { transition-delay: 0.25s; }
    .grid-card.is-visible:nth-child(2) .card-label     { transition-delay: 0.35s; }

    .grid-card.is-visible:nth-child(3) .image-wrapper { transition-delay: 0.4s; }
    .grid-card.is-visible:nth-child(3) .card-label     { transition-delay: 0.5s; }

    .grid-card.is-visible:nth-child(4) .image-wrapper { transition-delay: 0.55s; }
    .grid-card.is-visible:nth-child(4) .card-label     { transition-delay: 0.65s; }

    /* Footer Spacer to ensure scroll freedom */
    .footer-spacer {
      height: 80vh;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
      }
      .image-wrapper {
        height: 380px;
      }
    }
    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
      .section-title {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <header class="scroll-spacer">
    <p>The Art of Motion</p>
    <h1>Scroll Down Smoothly</h1>
  </header>

  <section class="luxury-gallery">
    <div class="section-header">
      <span class="section-subtitle">Exquisite Editorial</span>
      <h2 class="section-title">The Summer Edit</h2>
    </div>
    
    <div class="grid-container">
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Minimalist Object" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Warm Florals" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Glass bottle design" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Luxury sunglasses" class="parallax-img">
        </div>
      </div>
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Minimalist Object" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Warm Florals" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Glass bottle design" class="parallax-img">
        </div>
      </div>
      
      <div class="grid-card">
        <div class="image-wrapper">
          <img src="https://i.pinimg.com/736x/2e/43/5e/2e435e98cb104c688c21c0f9aa2f2b0f.jpg" alt="Luxury sunglasses" class="parallax-img">
        </div>
      </div>
    </div>
  </section>

  <div class="footer-spacer"></div>

  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      /* --- 0. SMOOTH SCROLL INITIALIZATION (Lenis) --- */
      const lenis = new Lenis({
        duration: 1.8,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // Smooth ease-out curve
        orientation: 'vertical',
        gestureOrientation: 'vertical',
        smoothWheel: true,
        wheelMultiplier: 1,
        infinite: false,
      });

      // Hook Lenis into our requestAnimationFrame loop
      function lenisRaf(time) {
        lenis.raf(time);
        requestAnimationFrame(lenisRaf);
      }
      requestAnimationFrame(lenisRaf);


      /* --- 1. ELEGANT ENTRANCE REVEAL (IntersectionObserver) --- */
      const observerOptions = {
        root: null,
        threshold: 0.12, /* Triggers when 12% of the card is in view */
        rootMargin: "0px 0px -80px 0px" /* Prevents triggering too early near page edges */
      };

      const scrollRevealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            // Stop observing once revealed for better performance
            scrollRevealObserver.unobserve(entry.target); 
          }
        });
      }, observerOptions);

      // Apply observer to header and cards
      const sectionHeader = document.querySelector(".section-header");
      if (sectionHeader) scrollRevealObserver.observe(sectionHeader);

      const gridCards = document.querySelectorAll(".grid-card");
      gridCards.forEach(card => scrollRevealObserver.observe(card));


      /* --- 2. ZERO-LAG PARALLAX (Perfect Scroll Sync) --- */
      const parallaxImages = document.querySelectorAll(".parallax-img");

      function updateParallax() {
        // Find how far down the viewport is
        const viewportHeight = window.innerHeight;

        parallaxImages.forEach(img => {
          const parentRect = img.parentElement.getBoundingClientRect();

          // Only calculate calculations if the image is actually visible on screen
          if (parentRect.top < viewportHeight && parentRect.bottom > 0) {
            
            // Calculate a position value relative to where the image is inside the viewport
            // This yields a linear, mathematically exact scroll tracking
            const distanceOffset = parentRect.top - viewportHeight;
            
            // Apply value directly into CSS variable on the image element
            img.style.setProperty('--scroll-y', `${distanceOffset}`);
          }
        });

        // Use requestAnimationFrame to continuously sync updates with the screen's hardware refresh rate
        requestAnimationFrame(updateParallax);
      }

      // Initialize the RAF Loop
      requestAnimationFrame(updateParallax);
    });
  </script>
</body>
</html>
